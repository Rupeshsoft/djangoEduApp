<section class="contact-page">
  <mat-card class="contact-card">
    <p class="eyebrow">Get in touch</p>
    <h1>Contact Us</h1>
    <ul>
      <li><strong>Email:</strong> support@rsportal.com</li>
      <li><strong>Phone:</strong> +91 98765 43210</li>
      <li><strong>Address:</strong> 24 Learning Avenue, Pune, India</li>
    </ul>

    <div class="map-wrapper">
      <iframe
        title="RS Portal location"
        [src]="mapUrl"

      ></iframe>
    </div>
  </mat-card>
</section>
